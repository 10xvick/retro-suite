name: Deploy Retro Suite to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Retro Suite
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4
        with:
          repository: '10xvick/10xvick.github.io'
          token: ${{ secrets.DEPLOY_SECRET }}
          path: 'portfolio'

      - name: Deploy built files to Portfolio
        run: |
          mkdir -p portfolio/emulator/retro-station
          # Clean up old files in emulator/retro-station
          rm -rf portfolio/emulator/retro-station/*
          # Copy new build files
          cp -r shell/dist/* portfolio/emulator/retro-station/

      - name: Commit and Push to Portfolio Repo
        run: |
          cd portfolio
          git config user.name "10xvick"
          git config user.email "priyasingh24197@gmail.com"
          git add emulator/retro-station
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "Deploy Retro Suite to emulator/retro-station"
            git push origin main
          fi
